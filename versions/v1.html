<style>
  :root { --ink:#101013; --line:#1e1e24; --dim:#6d6862; }
  * { box-sizing:border-box }
  html, body { margin:0; height:100%; overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  #app { height:100% }
  .viewport {
    position:fixed; inset:0; overflow:hidden;
    background-color:var(--ink);
    background-image:radial-gradient(circle, #26262d 1px, transparent 1px);
    background-size:24px 24px;
    touch-action:none;
  }
  .world { position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform }
  .frame { position:relative }
  .frame-label {
    position:absolute; top:-22px; left:0;
    font-size:11px; letter-spacing:.08em; color:var(--dim);
    user-select:none;
  }
  .stage {
    position:relative; width:440px;
    overflow:hidden; cursor:crosshair;
    box-shadow:0 0 0 1px var(--line), 0 24px 60px rgba(0,0,0,.5);
    background:#000;
  }
  .stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block }
  .zoom-chip {
    position:fixed; right:16px; bottom:16px; z-index:10;
    font-size:11px; color:var(--dim); letter-spacing:.08em;
    background:#17171c; border:1px solid var(--line);
    padding:6px 10px; border-radius:6px; user-select:none;
  }
  .toast {
    position:fixed; left:50%; bottom:24px; transform:translate(-50%, 16px);
    z-index:20; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s;
    font-size:12px; color:#e6e2da; letter-spacing:.04em;
    background:#17171c; border:1px solid #2a2a32;
    padding:10px 16px; border-radius:8px;
  }
  .toast.on { opacity:1; transform:translate(-50%, 0) }
</style>
